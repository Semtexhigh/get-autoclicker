name: patch-catalog
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 - <<'PY'
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          old = '{"label":"History (password)","url":"https://semtexhigh.github.io/s-solver/history.html"}]'
          new = '{"label":"History (password)","url":"https://semtexhigh.github.io/s-solver/history.html"},{"label":"Admin panel (password)","url":"https://semtexhigh.github.io/s-solver/admin.html"}]'
          assert s.count(old) == 1, s.count(old)
          assert 's-solver/admin.html' not in s
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          import json, re
          m = re.search(r'<script type="application/json" id="ps-embed">(.*?)</script>', s, re.S)
          d = json.loads(m.group(1))
          for pr in d['projects']:
              if pr['slug'] == 's-solver':
                  print('s-solver links:', [x['label'] for x in pr['links']['other']])
          print('json still parses, projects:', len(d['projects']))
          PY
      - name: commit
        run: |
          git config user.name Semtexhigh
          git config user.email 67ace67a@gmail.com
          git add index.html
          git commit -m "Catalog: add the S Solver admin panel link"
          git push
